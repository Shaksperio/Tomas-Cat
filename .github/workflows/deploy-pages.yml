name: Deploy Tomas Vagabundo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, grok/agent-runtime-bridge, codex/society-save-restore]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isola builds de PRs; somente execuções da mesma PR se substituem.
  # Deploys de main compartilham uma fila própria.
  group: github-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Society contract tests
        run: npm test
      - name: TypeScript check
        run: npm run lint
      - name: Build
        env:
          VITE_COWILA_AI_URL: ${{ vars.COWILA_AI_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          # ID do banco Firestore nomeado (não é segredo). O secret, se existir, tem prioridade.
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID || 'ai-studio-780f41f1-7f4e-40c2-91b7-1ac37ba9bac6' }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Post-deploy health check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 4
    steps:
      - name: Verify published GitHub Pages site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PAGE_URL}" || ! "${PAGE_URL}" =~ ^https:// ]]; then
            echo "::error::URL de publicação ausente ou inválida."
            exit 1
          fi

          ok=false
          for attempt in {1..12}; do
            if curl --connect-timeout 10 --max-time 30 --fail --silent --show-error "${PAGE_URL}" -o /tmp/tomas-index.html; then
              if grep -q '<title>Tomas Vagabundo' /tmp/tomas-index.html \
                && grep -q 'id="root"' /tmp/tomas-index.html \
                && grep -Eq 'assets/index-[^"]+\.js' /tmp/tomas-index.html; then
                ok=true
                break
              fi
              echo "HTML ainda não corresponde ao build esperado (tentativa ${attempt}/12)."
            else
              echo "Site ainda indisponível (tentativa ${attempt}/12)."
            fi
            sleep 10
          done

          if [[ "${ok}" != true ]]; then
            echo "::error::Health check pós-deploy falhou para ${PAGE_URL}."
            exit 1
          fi
          echo "GitHub Pages respondeu e contém o HTML inicial esperado."
