name: Agent merge gate

# Roda no contexto da branch padrão após o CI de uma PR (nunca executa código da PR).
# Só integra PRs com o rótulo "agent-pr" que passam em scripts/agent-gate/policy.ts.
# Fica inerte (modo simulação) até existir a variável de repositório AGENT_GATE_ENABLED=true.
on:
  workflow_run:
    workflows: ["Deploy Tomas Vagabundo to GitHub Pages"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: agent-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (branch padrão, não o código da PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Avaliar PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          AGENT_GATE_ENABLED: ${{ vars.AGENT_GATE_ENABLED }}
        run: npx tsx scripts/agent-gate/run.mjs
