name: Cowila ChatGPT MCP — isolated integration checks

on:
  pull_request:
    branches: [main]
    paths:
      - "integrations/cowila-chatgpt-mcp/**"
      - ".github/workflows/cowila-chatgpt-mcp.yml"
  push:
    branches: ["codex/cowila-chatgpt-mcp"]
    paths:
      - "integrations/cowila-chatgpt-mcp/**"
      - ".github/workflows/cowila-chatgpt-mcp.yml"

permissions:
  contents: read

concurrency:
  group: cowila-chatgpt-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cowila-mcp:
    name: TypeScript, OAuth/MCP integration and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/cowila-chatgpt-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/cowila-chatgpt-mcp/package.json

      - name: Install isolated dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type-check complete integration
        run: npm run typecheck

      - name: Run isolated unit tests
        run: npm test
