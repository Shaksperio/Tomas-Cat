name: Deploy Cowila AI Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/cowila-ai/**'
      - '.github/workflows/deploy-cowila-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cowila-ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Cowila Worker
        working-directory: workers/cowila-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e31728d760beddc69617fbdb81c5e007
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure o secret CLOUDFLARE_API_TOKEN no repositório para publicar o Worker."
            exit 1
          fi
          npx --yes wrangler@4.156.0 deploy
